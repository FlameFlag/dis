version: 2

project_name: dis

builds:
  - id: binaries
    binary: dis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: packages
    binary: dis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: binaries
    ids:
      - binaries
    formats:
      - binary
    name_template: "{{ .ProjectName }}{{ if not .IsSnapshot }}_{{ .Version }}{{ end }}_{{ .Os }}_{{ .Arch }}"

snapshot:
  version_template: "{{ incpatch .Version }}-rolling"

nfpms:
  - id: packages
    ids:
      - packages
    vendor: 4evy
    homepage: https://github.com/4evy/dis
    maintainer: Evy <4evy@users.noreply.github.com>
    description: >-
      A CLI and TUI for downloading, trimming, and compressing videos
    license: MIT
    section: video
    formats:
      - deb
      - rpm
    recommends:
      - ffmpeg
      - gifski
      - yt-dlp
    file_name_template: "{{ .ConventionalFileName }}"
    deb:
      lintian_overrides:
        - statically-linked-binary
    rpm:
      group: Unspecified

checksum:
  name_template: checksums.txt

release:
  preflight:
    fail_on_error: true

changelog:
  sort: asc
  filters:
    include:
      - '^feat(\([^)]*\))?!?:'
      - '^fix(\([^)]*\))?!?:'
      - '^refactor(\([^)]*\))?!?:'
      - '^perf(\([^)]*\))?!?:'

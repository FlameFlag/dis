name: Rolling Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

concurrency:
  group: rolling-release
  cancel-in-progress: false

permissions: {}

jobs:
  rolling:
    name: Rolling release
    # Publish only a tested push from a human maintainer or Renovate.
    # Renovate's immutable bot user ID is 29139614.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.actor.type == 'User' ||
      (github.event.workflow_run.actor.type == 'Bot' &&
      github.event.workflow_run.actor.id == 29139614))
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Needed to replace the rolling release and its assets.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build rolling artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean

      - name: Publish rolling release
        run: |
          jq -r '
            .[] |
            select(.type == "Binary") |
            select(.name | test("^dis_(linux_(amd64|arm64)|darwin_arm64|windows_(amd64|arm64))(\\.exe)?$")) |
            [.path, .name] |
            @tsv
          ' dist/artifacts.json |
          while IFS=$'\t' read -r source name; do
            cp "$source" "dist/$name"
          done

          if ! gh release view rolling >/dev/null 2>&1; then
            gh release create rolling \
              --target "$ROLLING_SHA" \
              --title "Rolling Release" \
              --notes "" \
              --prerelease
          fi

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/rolling" \
            -f sha="$ROLLING_SHA" \
            -F force=true

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/rolling" \
            --jq '.assets[].id' |
          while read -r asset_id; do
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
          done

          gh release upload rolling \
            dist/*.deb \
            dist/*.rpm \
            dist/dis_linux_amd64 \
            dist/dis_linux_arm64 \
            dist/dis_darwin_arm64 \
            dist/dis_windows_amd64.exe \
            dist/dis_windows_arm64.exe \
            dist/checksums.txt

          gh release edit rolling \
            --title "Rolling Release" \
            --notes "" \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROLLING_SHA: ${{ github.event.workflow_run.head_sha }}
